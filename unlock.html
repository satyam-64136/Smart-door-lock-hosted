<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0d12" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#e8ecf2" media="(prefers-color-scheme: light)">
<meta name="color-scheme" content="dark light">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="48x48" href="favicon-48.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Unlock">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Unlock</title>
<style>
:root{--bg:#0a0d12;--s1:#11161e;--s2:#171d28;--line:rgba(255,255,255,.08);--fg:#eef2f8;--mut:#8a97ab;--acc:#6d9bff;--ok:#38e0b0;--bad:#ff6b78;--dur:10s;
 --ease:cubic-bezier(.22,1,.36,1);--spring:cubic-bezier(.34,1.56,.64,1);
 --sh:0 1px 1px #0003,0 4px 8px #0002,0 18px 36px -10px #0006,inset 0 1px 0 #ffffff0d;color-scheme:dark}
@media(prefers-color-scheme:light){:root{--bg:#e8ecf2;--s1:#fff;--s2:#f2f5f9;--line:rgba(15,23,42,.1);--fg:#0f1722;--mut:#5b6a80;--acc:#2f63e6;--ok:#0c9a72;--bad:#d63546;
 --sh:0 1px 1px #0f172a0d,0 4px 8px #0f172a0d,0 18px 36px -10px #0f172a26,inset 0 1px 0 #fff;color-scheme:light}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{overscroll-behavior:none}
body{margin:0;min-height:100dvh;display:grid;place-items:center;color:var(--fg);padding:env(safe-area-inset-top) 16px env(safe-area-inset-bottom);
 font:16px/1.45 ui-rounded,system-ui,-apple-system,"Segoe UI",sans-serif;
 background:radial-gradient(70% 50% at 50% 0%,color-mix(in srgb,var(--acc) 15%,transparent),transparent 70%),var(--bg)}
main{width:min(360px,100%);display:grid;gap:22px;justify-items:center;padding:24px 0;text-align:center}
.pill{display:flex;align-items:center;gap:8px;padding:7px 13px;border-radius:99px;background:var(--s1);box-shadow:var(--sh);font-size:.78rem;color:var(--mut)}
.pill i{width:8px;height:8px;border-radius:50%;background:var(--bad);transition:.3s}
body[data-s=locked] .pill i,body[data-s=unlocked] .pill i{background:var(--ok);box-shadow:0 0 0 4px color-mix(in srgb,var(--ok) 22%,transparent)}
body[data-s=wait] .pill i{background:var(--mut);animation:pulse 1.2s infinite}
body[data-link=down] .pill i{background:var(--mut);box-shadow:none;animation:pulse 1.2s infinite}
.dial{position:relative;width:min(280px,76vw);aspect-ratio:1;display:grid;place-items:center}
.ring{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:5;stroke-linecap:round}
.ring .t{stroke:var(--line)}
.ring .p{stroke:var(--ok);stroke-dasharray:679;stroke-dashoffset:679;opacity:0}
body[data-s=unlocked] .p{opacity:1;animation:drain var(--dur) linear forwards}
.big{width:78%;aspect-ratio:1;border:0;border-radius:50%;display:grid;place-items:center;align-content:center;gap:8px;cursor:pointer;color:var(--fg);font:inherit;font-weight:650;font-size:1.15rem;
 background:linear-gradient(160deg,var(--s2),var(--s1));box-shadow:var(--sh);transition:transform .2s var(--spring),box-shadow .4s var(--ease),opacity .3s}
.big:hover:not(:disabled){transform:scale(1.03)}.big:active:not(:disabled){transform:scale(.94)}
.big:disabled{cursor:not-allowed;opacity:.55}
.big:focus-visible{outline:2px solid var(--acc);outline-offset:4px}
body[data-s=unlocked] .big{opacity:1;color:var(--ok);box-shadow:var(--sh),0 0 70px -12px color-mix(in srgb,var(--ok) 60%,transparent)}
body[data-link=down] .big{opacity:.55}
.lock{width:60px;height:60px;fill:none;stroke:currentColor;stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round}
.lock .sh{transition:transform .5s var(--spring);transform-origin:32px 28px}
body[data-s=unlocked] .lock .sh{transform:translateY(-7px) rotate(-18deg)}
#msg{min-height:1.4em;font-size:.9rem;color:var(--mut)}#msg.err{color:var(--bad)}#msg.good{color:var(--ok)}
.links{font-size:.8rem}.links a{color:var(--mut)}
@keyframes drain{to{stroke-dashoffset:0}}@keyframes pulse{50%{opacity:.35}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01s!important;transition-duration:.01s!important}}
</style></head>
<body data-s="wait"><main>
<div class="pill"><i></i><span id="conn">Connecting</span></div>
<div class="dial">
 <svg class="ring" viewBox="0 0 240 240" aria-hidden="true"><circle class="t" cx="120" cy="120" r="108"/><circle class="p" cx="120" cy="120" r="108"/></svg>
 <button class="big" id="big" disabled>
  <svg class="lock" viewBox="0 0 64 64" aria-hidden="true"><path class="sh" d="M21 28V20a11 11 0 0 1 22 0v8"/><rect x="15" y="28" width="34" height="25" rx="7"/><circle cx="32" cy="40" r="2.5"/></svg>
  <span id="bigT">Connecting</span>
 </button>
</div>
<div id="msg" role="status" aria-live="polite"></div>
<div class="links"><a href="index.html">Full app and settings</a></div>
</main>
<script>
const $=id=>document.getElementById(id);
const STALE=30000;   // link counts as asleep after this much silence (ms)
const DEFAULTS={host:'afaa6363.ala.asia-southeast1.emqxsl.com',port:8084,prefix:'lock/rohit-7f3k29xq'};   // same defaults as index.html
const CDNS=['mqtt.min.js','https://cdn.jsdelivr.net/npm/mqtt@5.10.1/dist/mqtt.min.js','https://unpkg.com/mqtt@5.10.1/dist/mqtt.min.js'];
const fill=c=>c&&{host:c.host||DEFAULTS.host,port:c.port||DEFAULTS.port,prefix:c.prefix||DEFAULTS.prefix,user:c.user,pass:c.pass};
const okCfg=c=>!!(c&&c.host&&c.user&&c.pass&&c.prefix);
let C=null;try{C=fill(JSON.parse(localStorage.getItem('lockcfg')))}catch(e){}
let m=null,T={},up=false,everUp=false,st='unknown',busy=false,fatal=false,libFail=false,want=false,t0=0,dur=10,tryN=0,lastStatusAt=0,lastRx=0,lastWake=0,hiddenAt=Date.now(),
    pend=null,msgT,stT,watchT;

function say(t,k=''){const e=$('msg');e.textContent=t;e.className=k;clearTimeout(msgT);if(t&&k)msgT=setTimeout(()=>{e.textContent='';e.className=''},6000)}
function buzz(p){try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}}
function clearPend(){clearTimeout(pend);pend=null}
function armWatch(sec){clearTimeout(watchT);watchT=setTimeout(()=>{if(st==='unlocked'){st='locked';render()}},(sec+4)*1000)}   // self-heal if the 'locked' message is missed
function restartRing(){const p=document.querySelector('.ring .p');p.style.animation='none';void p.getBoundingClientRect();p.style.animation=''}

function render(){
  const cfg=okCfg(C);
  document.body.dataset.s=st==='unknown'?'wait':st;      // last known lock state stays on screen while the link reconnects
  document.body.dataset.link=(up||!cfg)?'up':'down';
  $('conn').textContent=!navigator.onLine?'No internet':!cfg?'Not set up':fatal?'Login rejected':!up?(everUp?'Reconnecting':'Connecting'):st==='offline'?'Lock offline':st==='unknown'?'Checking lock':'Connected';
  $('big').disabled=cfg&&!fatal&&!libFail&&(!up||busy);   // only disabled while connecting or waiting for the lock
  $('bigT').textContent=!cfg?'Set up first':fatal?'Check settings':libFail?'Retry':!up?(everUp?'Reconnecting':'Connecting'):busy?'Unlocking...':st==='unlocked'?'Unlocked':st==='offline'?'Lock offline - retry':'Unlock';
}
function sendOpen(){
  m.publish(T.cmd,JSON.stringify({a:'open'}),{qos:0},err=>{if(err){clearPend();busy=false;want=false;say('Could not send. Try again.','err');render()}})}
function failMsg(){const a=lastStatusAt?Math.round((Date.now()-lastStatusAt)/1000):-1;
  return a>45?'The lock has not reported for '+a+' s. Check its power and WiFi.':'The lock did not answer. It may be busy. Try again.'}
function attempt(){
  const fresh=m&&m.connected&&Date.now()-lastRx<STALE;
  if(fresh)sendOpen();else{want=true;wake(true)}       // link may have slept in the background: reconnect, then send
  clearPend();
  pend=setTimeout(()=>{pend=null;
    if(tryN<1){tryN++;say('Retrying...');attempt();return}   // one automatic retry: opening twice is harmless
    busy=false;want=false;say(failMsg(),'err');wake(true);render()},fresh?4000:7000)}
function unlock(){
  if(busy)return;
  if(!okCfg(C)||fatal){location.href='index.html';return}
  if(libFail){location.reload();return}
  t0=performance.now();busy=true;tryN=0;say('');
  attempt();render();
}
$('big').onclick=unlock;

/* keep the link alive across app switches */
function wake(force){
  if(!m)return;const n=Date.now();
  if(n-lastWake<1500)return;
  if(m.connected&&!force&&n-lastRx<STALE)return;
  lastWake=n;m.end(true,()=>m.reconnect())}   // force-close a half-dead socket, then open a fresh one
addEventListener('online',()=>{wake(true);render()});addEventListener('offline',render);
document.addEventListener('visibilitychange',()=>{if(document.hidden)hiddenAt=Date.now();else wake(Date.now()-hiddenAt>4000)});
addEventListener('pageshow',e=>{if(e.persisted)wake(true)});
addEventListener('focus',()=>wake(false));
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol))addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));

function loadMqtt(){return new Promise((res,rej)=>{let i=0;(function n(){if(window.mqtt)return res();if(i>=CDNS.length)return rej();
  const s=document.createElement('script');s.src=CDNS[i++];s.onload=n;s.onerror=n;document.head.appendChild(s)})()})}
function noStatus(){if(st==='unknown'){st='offline';say('No response from the lock. Check its power and WiFi.','err');render()}}

function start(){
  T={cmd:C.prefix+'/cmd',evt:C.prefix+'/evt',st:C.prefix+'/status'};
  m=mqtt.connect('wss://'+C.host+':'+(C.port||8084)+'/mqtt',{username:C.user,password:C.pass,keepalive:15,reconnectPeriod:1500,connectTimeout:8000,queueQoSZero:false,clientId:'unlock-'+Math.random().toString(16).slice(2,8)});   // queueQoSZero off: a stale command is never replayed later
  m.on('packetreceive',()=>{lastRx=Date.now()});
  m.on('connect',()=>{up=everUp=true;lastRx=Date.now();m.subscribe([T.evt,T.st]);clearTimeout(stT);stT=setTimeout(noStatus,4000);
    if(want){want=false;sendOpen()}render()});
  m.on('close',()=>{up=false;if(!want){clearPend();busy=false}render()});   // keep a waiting unlock alive through the reconnect
  m.on('error',err=>{const t=String(err&&err.message||'');
    if(/refused|not authorized|bad user|credentials/i.test(t)){fatal=true;clearPend();busy=false;want=false;m.end(true);say('Login rejected. Check settings in the full app.','err');render()}else say('Connection problem. Retrying...','err')});
  m.on('message',(t,p)=>{
    lastRx=Date.now();
    const s=p.toString();
    if(t===T.st){lastStatusAt=Date.now();clearTimeout(stT);st=s==='unlocked'||s==='locked'?s:'offline';if(st==='offline')say('The lock is offline. Check its power and WiFi.','err');if(st==='unlocked')armWatch(dur);else clearTimeout(watchT);render();return}
    let e;try{e=JSON.parse(s)}catch(x){return}
    if(e.e==='locked'){st='locked';clearTimeout(watchT);if(!busy)say('');render();return}   // does not settle a pending unlock
    clearPend();busy=false;want=false;
    if(e.e==='unlocked'){
      if(e.s>0){dur=e.s;document.documentElement.style.setProperty('--dur',e.s+'s')}
      st='unlocked';armWatch(dur);restartRing();
      const ms=t0?Math.round(performance.now()-t0):0;t0=0;
      say(ms?'Unlocked in '+ms+' ms':'Unlocked','good');buzz([30,40,30])}
    else if(e.e==='disabled')say('One-tap unlock is turned off in the firmware.','err');
    else say('Unexpected reply from the lock.','err');
    render()})}

render();
if(!okCfg(C)){st='offline';render();say('Open "Full app and settings" and enter your username and password once.','err')}
else loadMqtt().then(start).catch(()=>{libFail=true;say('Could not load the connection library. Check your internet.','err');render()})
</script></body></html>
